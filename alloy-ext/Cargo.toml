[package]
name = "alloy-ext"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
infra-core = { workspace = true, features = ["rt-tokio"] }

tracing.workspace = true
anyhow.workspace = true

# Collections and atomic operations
parking_lot.workspace = true

# Core alloy dependencies (using available workspace deps)
alloy = { workspace = true, features = ["providers", "transport-http", "json-rpc"] }

# Tower transport stack
tower.workspace = true
tower-service.workspace = true

# Async runtime and concurrency
tokio.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
tokio = { version = "1.0.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
